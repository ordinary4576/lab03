name: CI/CD - Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissions required for deploying via official GitHub Pages actions
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments from conflicting
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # CONTINUOUS INTEGRATION (CI)
  # Validates dependencies, executes automated tests, and generates production build.
  # Runs on both pushes to main and pull requests targeting main.
  # ---------------------------------------------------------------------------
  build-and-validate:
    name: Build & Validate (CI)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm ci

      - name: 4. Code Formatting & Lint Validation
        run: npm run lint

      - name: 5. Execute Automated Unit Tests (CI)
        run: npm run test:ci

      - name: 6. Execute Angular Production Build
        run: npm run build:prod

      - name: 7. Verify Production Output and Routing Fallback
        run: |
          ls -la dist/lab03/browser
          test -f dist/lab03/browser/index.html || { echo "Missing index.html"; exit 1; }
          test -f dist/lab03/browser/404.html || { echo "Missing 404.html"; exit 1; }

      - name: 8. Upload GitHub Pages Artifact
        # Artifact upload only occurs on pushes to main (not on pull requests)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/lab03/browser'

  # ---------------------------------------------------------------------------
  # CONTINUOUS DEPLOYMENT (CD)
  # Deploys verified production artifact to GitHub Pages edge network.
  # Executes ONLY on pushes to main AND ONLY when CI validation succeeds.
  # ---------------------------------------------------------------------------
  deploy-to-pages:
    name: Deploy to GitHub Pages (CD)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-and-validate
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 8. Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
